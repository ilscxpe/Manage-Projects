<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <!-- Спокойный шрифт Inter для чёткого отображения формул и таблиц -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            }
          }
        }
      };
    }
  </script>
  <style>
    /* Защита от горизонтального скролла на iPhone X (375px) и современных смартфонах */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    /* Аккуратный скроллбар для полосы вопросов и таблиц задач */
    .thin-scroll::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }
    /* Безопасные отступы снизу для iPhone X – iPhone 16 */
    .pb-safe {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    /* Таблицы условий внутри карточек вопросов */
    .task-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .task-table th, .task-table td {
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 5px 7px;
      text-align: left;
      white-space: nowrap;
    }
    .task-table th {
      background-color: rgba(148, 163, 184, 0.12);
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-200 min-h-screen flex flex-col">

  <!-- ==================== ШАПКА ПРИЛОЖЕНИЯ ==================== -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-800/95 backdrop-blur border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-4xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
      <!-- Логотип -->

          УП
        </div>
        <div>
          <div class="text-sm sm:text-base font-bold leading-tight text-slate-900 dark:text-white">

          <span class="text-brand-600 dark:text-brand-400 font-bold">Φ(z)</span>

        <button onclick="toggleTheme()" title="Переключить тему" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">

            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />

          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== ОСНОВНОЙ КОНТЕНТ ==================== -->
  <main id="app-content" class="flex-1 max-w-4xl w-full mx-auto px-3 sm:px-6 pt-4 pb-24 md:pb-10">
    <div class="text-center py-12 text-sm text-slate-500">Загрузка тренажёра...</div>
  </main>

  <!-- ==================== НИЖНЯЯ ПАНЕЛЬ ДЛЯ СМАРТФОНОВ (iPhone X – iPhone 16) ==================== -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-slate-800/95 backdrop-blur border-t border-slate-200 dark:border-slate-700 pb-safe">
    <div class="grid grid-cols-5 h-14">
      <button onclick="navigate('home')" data-nav="home" class="nav-btn-mob flex flex-col items-center justify-center gap-0.5 text-[10px] font-medium text-slate-500 dark:text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Главная</span>
      </button>
      <button onclick="navigate('core8')" data-nav="core8" class="nav-btn-mob flex flex-col items-center justify-center gap-0.5 text-[10px] font-medium text-slate-500 dark:text-slate-400">

        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span>Билеты</span>
      </button>

        <div class="relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="nav-err-badge-mob" class="hidden absolute -top-1 -right-2.5 px-1 min-w-[16px] h-4 text-[9px] font-bold rounded-full bg-rose-500 text-white flex items-center justify-center">0</span>
        </div>
        <span>Ошибки</span>
      </button>
      <button onclick="navigate('cheatsheet')" data-nav="cheatsheet" class="nav-btn-mob flex flex-col items-center justify-center gap-0.5 text-[10px] font-medium text-slate-500 dark:text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Теория</span>
      </button>
    </div>
  </nav>

  <!-- ==================== МОДАЛЬНОЕ ОКНО: ТАБЛИЦА Φ(z) И ФОРМУЛЫ ==================== -->
  <div id="quick-modal" onclick="if(event.target===this) toggleQuickModal(false)" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-800 w-full sm:max-w-2xl max-h-[88vh] rounded-t-2xl sm:rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 flex flex-col overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <div class="font-bold text-sm sm:text-base">Таблица Φ(z) и формулы (из методички)</div>
        <button onclick="toggleQuickModal(false)" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="quick-modal-body" class="p-4 overflow-y-auto thin-scroll space-y-4 text-sm">
        <!-- Заполняется скриптом -->
      </div>
    </div>
  </div>

  <!-- ==================== МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ СБРОСА ==================== -->
  <div id="reset-modal" onclick="if(event.target===this) toggleResetModal(false)" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="font-bold text-base">Сбросить весь прогресс?</div>
      <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
        История решённых вопросов, статистика билетов и список «Мои ошибки» будут очищены.
      </p>
      <div class="flex gap-2 justify-end">
        <button onclick="toggleResetModal(false)" class="px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700">
          Отмена
        </button>
        <button onclick="confirmResetProgress()" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-600 text-white hover:bg-rose-700">
          Сбросить
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== ОСНОВНОЙ СКРИПТ ==================== -->
  <script>
    /**
     * 1. ТЕМАТИЧЕСКИЕ РАЗДЕЛЫ КУРСА (ПО МЕТОДИЧКЕ МГУ ЭФ)
     */
    const TOPICS = [
      { id: 'finance', icon: '₽', title: 'Финансовые показатели (Задача 9.1)', subtitle: 'NPV, IRR, PI, PBP, DPBP, классический профиль и реализуемость' },
      { id: 'cpm', icon: '⤢', title: 'Сетевое планирование CPM и лаги', subtitle: 'Построение сети AON, резервы R = LS − ES, примеры 1–2 и ДЗ 1–4' },
      { id: 'pdm', icon: '⇄', title: 'Сложные связи PDM (Задача 6.2)', subtitle: 'Связи FS, SS, FF, SF, правило двух букв и пример 3' },
      { id: 'pert', icon: 'σ', title: 'Метод PERT (Задачи 7.3 и 7.2)', subtitle: 'Оценки tₑ и σ², сложение дисперсий, таблица Φ(z) и срок 95%' },
      { id: 'risks', icon: '⚡', title: 'Риски и сжатие сроков (10.1 и 8.8)', subtitle: 'Сценарный анализ, EMV, выбор мер и метод Crashing' },
      { id: 'resources', icon: '⊞', title: 'Ресурсы, RACI и Make-or-Buy (11.3, 12.2)', subtitle: 'Матрица ответственности, порог Q* = 160, выравнивание и RBS' },
      { id: 'theory', icon: '★', title: 'Стандарты, инициация и качество', subtitle: 'PMBOK, PRINCE2, ИСР (WBS), SMART, цикл PDCA и диаграмма Парето' }
    ];

    /**
     * 2. СПРАВОЧНИК 8 БАЗОВЫХ ЗАДАЧ КР (СТР. 3–20 МЕТОДИЧКИ)
     */
    const CORE_8_TASKS = [
      {
        code: 'Задача 10.1',
        title: 'Сценарный анализ: два независимых риска и штраф',
        topic: 'risks',
        pages: 'Стр. 3–5 методички',
        formulas: [
          'P(не случится) = 1 − p',
          'Независимые риски: P(A ∩ B) = P(A) · P(B), Σ Pᵢ = 1',
          'Срок в сценарии = max(длин всех путей)',
          'Ожидаемый штраф (EMV) = Σ pᵢ · штрафᵢ',
          'Затраты меры = цена меры + ожидаемый штраф после меры'
        ],
        conditionHtml: `
          <p class="mb-2">Работы: <strong>A</strong> (3 дня); <strong>B</strong> (4 дня, после A); <strong>C</strong> (2 дня, после A); <strong>D</strong> (2 дня, после B и C). Срок по договору <strong>9 дней</strong>, штраф <strong>50 тыс. руб.</strong> за каждый день просрочки.</p>
          <p>Риски независимы: <strong>R1</strong> — работа B задержится на 1 день (p = 40%); <strong>R2</strong> — работа C задержится на 3 дня (p = 50%). Меры: устранить R1 за 25 тыс., устранить R2 за 10 тыс.</p>
        `,
        steps: [
          '<strong>Шаг 1. Сеть и пути:</strong> Путь 1 (A→B→D) = 3+4+2 = 9 дн. (критический); Путь 2 (A→C→D) = 3+2+2 = 7 дн. Срок T = 9 дн., резерв C = 9 − 7 = 2 дня.',
          '<strong>Шаг 2. Влияние рисков:</strong> R1 (B+1) удлиняет критический Путь 1 до 10 дн. R2 (C+3) даёт задержку 3 дня > резерва 2 дня, поэтому Путь 2 становится 3+5+2 = 10 дн.',
          '<strong>Шаг 3–4. Таблица 4 сценариев:</strong><br>• Нет рисков (0.6×0.5 = 0.3): пути 9 и 7 → срок 9, штраф 0.<br>• Только R1 (0.4×0.5 = 0.2): пути 10 и 7 → срок 10, штраф 50.<br>• Только R2 (0.6×0.5 = 0.3): пути 9 и 10 → срок 10, штраф 50.<br>• Оба риска (0.4×0.5 = 0.2): пути 10 и 10 → срок max(10;10) = 10 (НЕ 11!), штраф 50.',
          '<strong>Шаг 5–6. Выбор меры:</strong><br>• Принять: 0 + 35 = <strong>35 тыс.</strong> (P в срок = 0.3)<br>• Убрать R1: 25 + 0.5×50 = <strong>50 тыс.</strong> (P = 0.5 — хуже, чем ничего не делать!)<br>• Убрать R2: 10 + 0.4×50 = <strong>30 тыс.</strong> (P = 0.6 — минимум ожидаемых затрат)<br>• Убрать оба: 35 + 0 = <strong>35 тыс.</strong> (P = 1.0 — гарантия срока).'
        ],
        trap: 'В сценарии «оба риска» срок равен 10 дням, а не 11, так как задержки происходят на параллельных ветках B и C и не складываются.'
      },
      {
        code: 'Задача 7.3',
        title: 'Метод PERT: полный алгоритм',
        topic: 'pert',
        pages: 'Стр. 6–8 методички',
        formulas: [
          'tₑ = (a + 4m + b) / 6',
          'σ² = ((b − a) / 6)²',
          'Tₑ = Σ tₑ (по критическому пути)',
          'σ²_пр = Σ σ² (ТОЛЬКО критического пути!), σ = √σ²_пр',
          'z = (T − Tₑ) / σ; обратная задача: T = Tₑ + z · σ'
        ],
        conditionHtml: `
          <div class="overflow-x-auto thin-scroll">
            <table class="task-table">
              <thead><tr><th>Работа</th><th>Предш.</th><th>a</th><th>m</th><th>b</th><th>tₑ</th><th>σ²</th></tr></thead>
              <tbody>
                <tr><td>A</td><td>—</td><td>2</td><td>4</td><td>6</td><td>4</td><td>0.444</td></tr>
                <tr><td>B</td><td>—</td><td>1</td><td>2</td><td>3</td><td>2</td><td>0.111</td></tr>
                <tr><td>C</td><td>A</td><td>2</td><td>3</td><td>4</td><td>3</td><td>0.111</td></tr>
                <tr><td>D</td><td>B</td><td>3</td><td>4</td><td>5</td><td>4</td><td>0.111</td></tr>
                <tr><td>E</td><td>C, D</td><td>1</td><td>2</td><td>3</td><td>2</td><td>0.111</td></tr>
              </tbody>
            </table>
          </div>
        `,
        steps: [
          '<strong>Шаг 1–2. Оценки работ:</strong> Для A: tₑ = (2+4·4+6)/6 = 4; σ² = ((6−2)/6)² = 16/36 = 0.444. Для B, C, D, E размах b−a = 2, значит σ² = (2/6)² = 4/36 = 0.111.',
          '<strong>Шаг 3. Критический путь:</strong> A→C→E = 4+3+2 = 9 дн.; B→D→E = 2+4+2 = 8 дн. Ожидаемый срок Tₑ = 9 дней, критический путь A→C→E.',
          '<strong>Шаг 4. Дисперсия и σ проекта:</strong> Складываем дисперсии только критического пути: σ²_пр = 0.444 + 0.111 + 0.111 = 0.667. Извлекаем корень: σ_пр = √0.667 ≈ 0.816.',
          '<strong>Шаг 5. Вероятность уложиться в 10 дней:</strong> z = (10 − 9) / 0.816 ≈ 1.22. По таблице Φ(1.22) = 0.8888 ≈ 89%.',
          '<strong>Шаг 6. Срок с надёжностью 95%:</strong> Для 95% по таблице z = 1.645. T = 9 + 1.645 · 0.816 ≈ 10.34 дня (при выдаче целого срока заказчику округляем вверх до 11 дней).'
        ],
        trap: 'Нельзя складывать σ вместо дисперсий σ², нельзя брать дисперсии некритических работ (B и D) и нельзя забывать извлечь корень в конце.'
      },
      {
        code: 'Задача 7.2',
        title: 'PERT (устно): вероятности и правило симметрии',
        topic: 'pert',
        pages: 'Стр. 8 методички',
        formulas: [
          'σ = √σ²',
          'z = (T − Tₑ) / σ',
          'Φ(−z) = 1 − Φ(z) или через Лапласа: 0.5 − Φ₀(|z|)',
          'T₉₅% = Tₑ + 1.645 · σ'

      try {
        if (window.localStorage) {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

        // Игнорируем ошибку квоты или приватного режима

    let currentView = 'home';

    let zSearchValue = '1.13';

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function prepareQuestion(q) {
      const indexed = q.options.map((text, idx) => ({
        text,
        isCorrect: idx === q.correct
      }));
      const shuffled = shuffleArray(indexed);
      return {
        ...q,
        shuffledOptions: shuffled.map(o => o.text),
        shuffledCorrect: shuffled.findIndex(o => o.isCorrect)
      };
    }

      const errCount = appState.errors.length;
      const deskBadge = document.getElementById('nav-err-badge-desk');

      if (deskBadge) {

        deskBadge.classList.toggle('hidden', errCount === 0);

        userAnswers: new Array(prepared.length).fill(null),
        timeLeft: timeLimitSec,
        startedAt: Date.now()
      };
      if (timeLimitSec > 0) {
        timerInterval = setInterval(() => {
          if (!quizSession) return stopTimer();
          quizSession.timeLeft--;
          const timerEl = document.getElementById('exam-timer');
          if (timerEl) timerEl.textContent = formatTime(quizSession.timeLeft);
          if (quizSession.timeLeft <= 0) {
            finishQuiz();
          }
        }, 1000);
      }
      currentView = 'quiz';
      updateActiveNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderQuiz();
    }

    function startTicket(ticketId) {
      const ticket = TICKETS.find(t => t.id === ticketId);
      if (!ticket) return;
      const qs = ticket.qIds.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);
      startQuiz({ title: ticket.title, mode: 'ticket', questions: qs, ticketId });
    }

    function startTopic(topicId) {
      const topic = TOPICS.find(t => t.id === topicId);
      const qs = QUESTIONS.filter(q => q.topic === topicId);
      startQuiz({ title: topic ? topic.title : 'Тема', mode: 'topic', questions: qs });
    }

    function startRandomMix(count = 20) {
      const qs = shuffleArray(QUESTIONS).slice(0, Math.min(count, QUESTIONS.length));
      startQuiz({ title: `Билеты вразброс (${qs.length} вопросов)`, mode: 'random', questions: qs });
    }

    function startExamMode() {
      const qs = shuffleArray(QUESTIONS).slice(0, 15);
      startQuiz({
        title: 'Экзамен (режим контрольной работы)',
        mode: 'exam',
        questions: qs,
        timeLimitSec: 30 * 60

    }

    function startErrorsMode() {
      const qs = appState.errors.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);

      startQuiz({ title: `Работа над ошибками (${qs.length})`, mode: 'errors', questions: qs });

      startQuiz({ title: `Избранные вопросы (${qs.length})`, mode: 'favorites', questions: qs });

    function formatTime(sec) {
      const m = Math.floor(Math.max(0, sec) / 60);
      const s = Math.max(0, sec) % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

    function selectAnswer(optIdx) {
      if (!quizSession) return;
      const idx = quizSession.currentIndex;
      const q = quizSession.questions[idx];
      if (quizSession.userAnswers[idx] !== null && quizSession.mode !== 'exam') return;

      quizSession.userAnswers[idx] = optIdx;
      const isRight = optIdx === q.shuffledCorrect;

      // Обновляем глобальную статистику и список ошибок
      appState.answered[q.id] = isRight;
      if (isRight) {
        appState.errors = appState.errors.filter(id => id !== q.id);
      } else if (!appState.errors.includes(q.id)) {
        appState.errors.push(q.id);
      }
      saveState();

      // В режиме экзамена автоматически переходим к следующему неотвеченному вопросу
      if (quizSession.mode === 'exam') {
        const nextUnanswered = quizSession.userAnswers.findIndex((a, i) => i > idx && a === null);
        if (nextUnanswered !== -1) {
          quizSession.currentIndex = nextUnanswered;
        }
      }
      renderQuiz();
    }

    function jumpToQuestion(newIdx) {
      if (!quizSession) return;
      if (newIdx < 0 || newIdx >= quizSession.questions.length) return;
      quizSession.currentIndex = newIdx;
      renderQuiz();
    }

    function toggleFavorite(qId) {
      if (appState.favorites.includes(qId)) {
        appState.favorites = appState.favorites.filter(id => id !== qId);
      } else {
        appState.favorites.push(qId);
      }
      saveState();
      if (currentView === 'quiz') renderQuiz();
    }

    function finishQuiz() {
      stopTimer();
      if (!quizSession) return navigate('home');
      let correct = 0;
      quizSession.questions.forEach((q, i) => {
        if (quizSession.userAnswers[i] === q.shuffledCorrect) correct++;
      });
      if (quizSession.mode === 'ticket' && quizSession.ticketId) {
        const prev = appState.ticketBest[quizSession.ticketId];
        if (!prev || correct >= prev.correct) {
          appState.ticketBest[quizSession.ticketId] = {
            correct,
            total: quizSession.questions.length
          };
          saveState();
        }
      }
      currentView = 'result';
      updateActiveNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderResult();
    }

      quizSession.questions.forEach((q, i) => {
        if (quizSession.userAnswers[i] === q.shuffledCorrect) correct++;

      const container = document.getElementById('app-content');
      container.innerHTML = `

                : 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300'

              <button onclick="navigate('home')" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-700 transition">

    /**
     * 16. ШПАРГАЛКА ФОРМУЛ И ИНТЕРАКТИВНАЯ ТАБЛИЦА Φ(z)
     */
    function buildPhiHelperHtml() {
      const zNum = parseFloat(String(zSearchValue).replace(',', '.'));
      let lookupResult = 'Введите значение z от −3.09 до +3.09 (например: −1.13 или 1.22)';
      let highlightRow = null;
      let highlightCol = null;

      if (!isNaN(zNum) && Math.abs(zNum) <= 3.09) {
        const absZ = Math.abs(zNum);
        const rowKey = (Math.floor(absZ * 10 + 1e-9) / 10).toFixed(1);
        const colIdx = Math.round((absZ - parseFloat(rowKey)) * 100);
        if (PHI_TABLE[rowKey] && PHI_TABLE[rowKey][colIdx] !== undefined) {
          highlightRow = rowKey;
          highlightCol = colIdx;
          const phiPos = PHI_TABLE[rowKey][colIdx];
          const finalPhi = zNum < 0 ? (1 - phiPos) : phiPos;
          const laplacePhi0 = finalPhi - 0.5;
          lookupResult = zNum < 0
            ? `Φ(${zNum.toFixed(2)}) = 1 − Φ(${absZ.toFixed(2)}) = 1 − ${phiPos.toFixed(4)} = <strong>${finalPhi.toFixed(4)}</strong> (${(finalPhi * 100).toFixed(1)}%)`
            : `Φ(${zNum.toFixed(2)}) = <strong>${finalPhi.toFixed(4)}</strong> (${(finalPhi * 100).toFixed(1)}%) • Функция Лапласа Φ₀ = ${laplacePhi0.toFixed(4)}`;
        }
      }

      const rowsHtml = Object.keys(PHI_TABLE).map(rowKey => {
        const cells = PHI_TABLE[rowKey].map((val, cIdx) => {
          const isHl = rowKey === highlightRow && cIdx === highlightCol;
          return `<td class="${isHl ? 'bg-brand-600 text-white font-bold' : ''}">${val.toFixed(4)}</td>`;
        }).join('');
        return `<tr><th>${rowKey}</th>${cells}</tr>`;
      }).join('');

      return `
        <div class="space-y-3">
          <div class="bg-brand-50 dark:bg-brand-500/10 border border-brand-200 dark:border-brand-500/30 rounded-xl p-3 space-y-2">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <label class="text-xs font-bold text-slate-800 dark:text-slate-200">Быстрый поиск по таблице Φ(z):</label>
              <input type="text" value="${zSearchValue}" oninput="zSearchValue=this.value; refreshPhiWidgets();" placeholder="Напр. -1.13" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs font-mono w-full sm:w-36 focus:outline-none focus:border-brand-500" />
            </div>
            <div class="text-xs text-slate-800 dark:text-slate-200">${lookupResult}</div>
          </div>

          <div class="overflow-x-auto thin-scroll max-h-72 border border-slate-200 dark:border-slate-700 rounded-xl">
            <table class="task-table">
              <thead>
                <tr>
                  <th>z</th>
                  <th>0.00</th><th>0.01</th><th>0.02</th><th>0.03</th><th>0.04</th>
                  <th>0.05</th><th>0.06</th><th>0.07</th><th>0.08</th><th>0.09</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function refreshPhiWidgets() {
      const modalBody = document.getElementById('quick-modal-body');
      if (modalBody && !document.getElementById('quick-modal').classList.contains('hidden')) {
        modalBody.innerHTML = buildPhiHelperHtml();

      const pagePhiBox = document.getElementById('cheatsheet-phi-box');

    function toggleQuickModal(show) {

    function renderCheatsheet() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="space-y-4">
          <div>
            <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">Шпаргалка формул и таблица Φ(z)</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">На контрольной формулы не выдают — их нужно знать наизусть (стр. 2 и 68 методички)</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">1. Финансовые показатели</div>
              <div>• <strong>NPV</strong> = Σ CFₜ / (1 + r)ᵗ (NPV &gt; 0 → выгоден)</div>
              <div>• <strong>IRR</strong>: ставка r, при которой NPV = 0</div>
              <div>• <strong>PI</strong> = Σ дисконт. притоков / дисконт. инвестиции</div>
              <div>• <strong>PBP, DPBP</strong> = полные годы + (недостающая сумма / поток след. года)</div>
              <div>• <strong>Классический профиль:</strong> NPV &gt; 0 ⇔ IRR &gt; r ⇔ PI &gt; 1</div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">2. Метод PERT и вероятности</div>
              <div>• <strong>tₑ</strong> = (a + 4m + b) / 6; <strong>σ²</strong> = ((b − a) / 6)²</div>
              <div>• <strong>Tₑ</strong> = Σ tₑ (крит. путь); <strong>σ²_пр</strong> = Σ σ² (крит. путь); <strong>σ</strong> = √σ²_пр</div>
              <div>• <strong>z</strong> = (D − Tₑ) / σ; <strong>P</strong> = Φ(z) = 0.5 + Φ₀(z); Φ(−z) = 1 − Φ(z)</div>
              <div>• <strong>Обратная задача:</strong> D = Tₑ + z·σ (округлять вверх!)</div>
              <div>• 90% → 1.282 | 95% → 1.645 | 97.5% → 1.96 | 99% → 2.326</div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">3. Сетевое планирование CPM и PDM</div>
              <div>• <strong>Прямой проход:</strong> ES = max(огр. начала), EF = ES + t</div>
              <div>• <strong>Обратный проход:</strong> LF = min(огр. конца), LS = LF − t</div>
              <div>• <strong>Резерв:</strong> R = LS − ES = LF − EF (R = 0 на крит. пути)</div>
              <div>• <strong>кA→нB(+L):</strong> ES_B ≥ EF_A + L | <strong>нA→нB(+L):</strong> ES_B ≥ ES_A + L</div>
              <div>• <strong>кA→кB(+L):</strong> EF_B ≥ EF_A + L | <strong>нA→кB(+L):</strong> EF_B ≥ ES_A + L</div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">4. Риски, Crashing и Make-or-Buy</div>
              <div>• <strong>EMV</strong> = Σ pᵢ · ущербᵢ; независимые: P(A∩B) = P(A)·P(B)</div>
              <div>• <strong>Crashing k</strong> = (Затраты_мин − Затраты_об) / (Срок_об − Срок_мин)</div>
              <div>• <strong>Make-or-Buy порог Q*</strong> = FC_запуск / (P_покупки − VC_своя)</div>
              <div>• <strong>RACI:</strong> ровно один A и минимум один R на каждую строку</div>
            </div>
          </div>

          <div id="cheatsheet-phi-box" class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
            ${buildPhiHelperHtml()}
          </div>
        </div>
      `;
    }

    /**
     * 17. ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
     */
    function initApp() {
      try {
        loadState();
        updateBadges();
        navigate('home');
      } catch (err) {
        const el = document.getElementById('app-content');
        if (el) {
          el.innerHTML = `<div class="p-4 rounded-xl bg-rose-50 text-rose-700 text-sm">Ошибка запуска: ${err.message}</div>`;
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>

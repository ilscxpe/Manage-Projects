  <!-- ==================== ОСНОВНОЙ СКРИПТ ==================== -->
  <script>
    /**
     * 1. ТЕМАТИЧЕСКИЕ РАЗДЕЛЫ КУРСА (ПО МЕТОДИЧКЕ И ЛЕКЦИЯМ МГУ ЭФ)
     */
    const TOPICS = [
      { id: 'finance', icon: '₽', title: 'Финансы, CAPM и инвестиционные решения', subtitle: 'NPV, IRR, PI, PBP/DPBP, бюджет и резервы, реальные опционы, CAPM, эффект Фливбьерга и ГЧП' },
      { id: 'cpm', icon: '⤢', title: 'Сетевое планирование CPM, лаги и ПО', subtitle: 'Сеть AON, резервы, лаги vs работы, MS Project, Primavera P6 и ProjectLibre' },

      { id: 'risks', icon: '⚡', title: 'Риски и сжатие сроков (10.1 и 8.8)', subtitle: 'Сценарный анализ, EMV, Crashing vs Fast Tracking, стратегии реагирования' },

      { id: 'scope_quality', icon: '✓', title: 'Содержание и качество (Лекция 3)', subtitle: 'Scope Baseline, WBS, scope creep vs gold plating, SLA, Исикава, Парето, карты и 1:10:100' },
      { id: 'theory', icon: '★', title: 'Основы, инициация, контроль и методологии', subtitle: 'PMBOK 8, PRINCE2, EEF/OPA, Устав, мониторинг и аудит (Тема 10), Waterfall/Stage-Gate/Agile' }
    ];

    /**
     * 2. СПРАВОЧНИК 8 БАЗОВЫХ ЗАДАЧ КР (СТР. 3–20 МЕТОДИЧКИ)
     */
    const CORE_8_TASKS = [
      {
        code: 'Задача 10.1',

        topic: 'risks',
        pages: 'Стр. 3–5 методички',
        formulas: [
          'P(не случится) = 1 − p',
          'Независимые риски: P(A ∩ B) = P(A) · P(B), Σ Pᵢ = 1',
          'Срок в сценарии = max(длин всех путей)',
          'Ожидаемый штраф (EMV) = Σ pᵢ · штрафᵢ',
          'Затраты меры = цена меры + ожидаемый штраф после меры'
        ],
        conditionHtml: `
          <p class="mb-2">Работы: <strong>A</strong> (3 дня); <strong>B</strong> (4 дня, после A); <strong>C</strong> (2 дня, после A); <strong>D</strong> (2 дня, после B и C). Срок по договору <strong>9 дней</strong>, штраф <strong>50 тыс. руб.</strong> за каждый день просрочки.</p>
          <p>Риски независимы: <strong>R1</strong> — работа B задержится на 1 день (p = 40%); <strong>R2</strong> — работа C задержится на 3 дня (p = 50%). Меры: устранить R1 за 25 тыс., устранить R2 за 10 тыс.</p>
        `,
        steps: [
          '<strong>Шаг 1. Сеть и пути:</strong> Путь 1 (A→B→D) = 3+4+2 = 9 дн. (критический); Путь 2 (A→C→D) = 3+2+2 = 7 дн. Срок T = 9 дн., резерв C = 9 − 7 = 2 дня.',
          '<strong>Шаг 2. Влияние рисков:</strong> R1 (B+1) удлиняет критический Путь 1 до 10 дн. R2 (C+3) даёт задержку 3 дня > резерва 2 дня, поэтому Путь 2 становится 3+5+2 = 10 дн.',

        ],
        trap: 'В сценарии «оба риска» срок равен 10 дням, а не 11, так как задержки происходят на параллельных ветках B и C и не складываются.'
      },
      {
        code: 'Задача 7.3',
        title: 'Метод PERT: полный алгоритм',
        topic: 'pert',
        pages: 'Стр. 6–8 методички',
        formulas: [
          'tₑ = (a + 4m + b) / 6',
          'σ² = ((b − a) / 6)²',
          'Tₑ = Σ tₑ (по критическому пути)',
          'σ²_пр = Σ σ² (ТОЛЬКО критического пути!), σ = √σ²_пр',
          'z = (T − Tₑ) / σ; обратная задача: T = Tₑ + z · σ'
        ],
        conditionHtml: `
          <div class="overflow-x-auto thin-scroll">
            <table class="task-table">
              <thead><tr><th>Работа</th><th>Предш.</th><th>a</th><th>m</th><th>b</th><th>tₑ</th><th>σ²</th></tr></thead>

                <tr><td>C</td><td>A</td><td>2</td><td>3</td><td>4</td><td>3</td><td>0.111</td></tr>

            </table>
          </div>
        `,
        steps: [
          '<strong>Шаг 1–2. Оценки работ:</strong> Для A: tₑ = (2+4·4+6)/6 = 4; σ² = ((6−2)/6)² = 16/36 = 0.444. Для B, C, D, E размах b−a = 2, значит σ² = (2/6)² = 4/36 = 0.111.',

        trap: 'Нельзя складывать σ вместо дисперсий σ², нельзя брать дисперсии некритических работ (B и D) и нельзя забывать извлечь корень в конце.'

      {
        code: 'Задача 7.2',
        title: 'PERT (устно): вероятности и правило симметрии',
        topic: 'pert',
        pages: 'Стр. 8 методички',

        }
      } catch (e) {
        // Если браузер блокирует localStorage (например, при открытии локального файла на iOS), работаем в памяти
      }
      if (appState.darkMode) {
        document.documentElement.classList.add('dark');
      }
    }

    function saveState() {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }
      } catch (e) {
        // Игнорируем ошибку квоты или приватного режима
      }
      updateBadges();
    }

    /**
     * 7. СОСТОЯНИЕ АКТИВНОЙ СЕССИИ ТЕСТИРОВАНИЯ И НАВИГАЦИИ
     */
    let currentView = 'home';
    let selectedCoreTaskIdx = 0;
    let quizSession = null;
    let timerInterval = null;
    let zSearchValue = '1.13';

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function prepareQuestion(q) {
      const indexed = q.options.map((text, idx) => ({
        text,
        isCorrect: idx === q.correct
      }));
      const shuffled = shuffleArray(indexed);
      return {
        ...q,
        shuffledOptions: shuffled.map(o => o.text),
        shuffledCorrect: shuffled.findIndex(o => o.isCorrect)
      };
    }

    function updateBadges() {
      const errCount = appState.errors.length;
      const deskBadge = document.getElementById('nav-err-badge-desk');
      const mobBadge = document.getElementById('nav-err-badge-mob');
      if (deskBadge) {
        deskBadge.textContent = errCount;
        deskBadge.classList.toggle('hidden', errCount === 0);
      }
      if (mobBadge) {
        mobBadge.textContent = errCount;
        mobBadge.classList.toggle('hidden', errCount === 0);
      }
    }

    function updateActiveNav() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.nav === currentView;
        btn.className = isActive
          ? 'nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-xs transition flex items-center gap-1.5'

      });
      document.querySelectorAll('.nav-btn-mob').forEach(btn => {
        const isActive = btn.dataset.nav === currentView;
        btn.classList.toggle('text-brand-600', isActive);
        btn.classList.toggle('dark:text-brand-400', isActive);
        btn.classList.toggle('text-slate-500', !isActive);
        btn.classList.toggle('dark:text-slate-400', !isActive);
      });
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function navigate(view) {
      stopTimer();
      currentView = view;
      updateActiveNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (view === 'home') renderHome();
      else if (view === 'core8') renderCore8();
      else if (view === 'tickets') renderTickets();
      else if (view === 'topics') renderTopics();
      else if (view === 'errors') renderErrors();
      else if (view === 'cheatsheet') renderCheatsheet();
      else if (view === 'quiz') renderQuiz();
      else if (view === 'result') renderResult();

      appState.darkMode = !appState.darkMode;
      document.documentElement.classList.toggle('dark', appState.darkMode);
      saveState();

    /**
     * 8. ЗАПУСК РЕЖИМОВ ТЕСТИРОВАНИЯ
     */
    function startQuiz({ title, mode, questions, ticketId = null, timeLimitSec = 0 }) {
      if (!questions || questions.length === 0) return;
      stopTimer();
      const prepared = questions.map(prepareQuestion);
      quizSession = {
        title,
        mode,
        ticketId,
        questions: prepared,
        currentIndex: 0,
        userAnswers: new Array(prepared.length).fill(null),
        timeLeft: timeLimitSec,
        startedAt: Date.now()
      };
      if (timeLimitSec > 0) {
        timerInterval = setInterval(() => {
          if (!quizSession) return stopTimer();
          quizSession.timeLeft--;
          const timerEl = document.getElementById('exam-timer');
          if (timerEl) timerEl.textContent = formatTime(quizSession.timeLeft);
          if (quizSession.timeLeft <= 0) {
            finishQuiz();
          }
        }, 1000);
      }
      currentView = 'quiz';
      updateActiveNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderQuiz();
    }

    function startTicket(ticketId) {
      const ticket = TICKETS.find(t => t.id === ticketId);
      if (!ticket) return;
      const qs = ticket.qIds.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);
      startQuiz({ title: ticket.title, mode: 'ticket', questions: qs, ticketId });
    }

    function startTopic(topicId) {
      const topic = TOPICS.find(t => t.id === topicId);
      const qs = QUESTIONS.filter(q => q.topic === topicId);
      startQuiz({ title: topic ? topic.title : 'Тема', mode: 'topic', questions: qs });
    }

    function startLecturesOnly(count = 25) {
      const lectureQs = QUESTIONS.filter(q => q.id >= 51);
      const qs = shuffleArray(lectureQs).slice(0, Math.min(count, lectureQs.length));

    }

    function startRandomMix(count = 20) {

    function startExamMode() {

      startQuiz({
        title: 'Экзамен (режим контрольной работы)',

    function startErrorsMode() {
      const qs = appState.errors.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);

    function startFavoritesMode() {
      const qs = appState.favorites.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);

    function formatTime(sec) {
      const m = Math.floor(Math.max(0, sec) / 60);
      const s = Math.max(0, sec) % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function selectAnswer(optIdx) {
      if (!quizSession) return;
      const idx = quizSession.currentIndex;
      const q = quizSession.questions[idx];
      if (quizSession.userAnswers[idx] !== null && quizSession.mode !== 'exam') return;

      quizSession.userAnswers[idx] = optIdx;
      const isRight = optIdx === q.shuffledCorrect;

      // Обновляем глобальную статистику и список ошибок
      appState.answered[q.id] = isRight;
      if (isRight) {
        appState.errors = appState.errors.filter(id => id !== q.id);
      } else if (!appState.errors.includes(q.id)) {
        appState.errors.push(q.id);
      }
      saveState();

      // В режиме экзамена автоматически переходим к следующему неотвеченному вопросу
      if (quizSession.mode === 'exam') {
        const nextUnanswered = quizSession.userAnswers.findIndex((a, i) => i > idx && a === null);
        if (nextUnanswered !== -1) {
          quizSession.currentIndex = nextUnanswered;
        }
      }
      renderQuiz();
    }

    function jumpToQuestion(newIdx) {
      if (!quizSession) return;
      if (newIdx < 0 || newIdx >= quizSession.questions.length) return;
      quizSession.currentIndex = newIdx;
      renderQuiz();
    }

    function toggleFavorite(qId) {
      if (appState.favorites.includes(qId)) {
        appState.favorites = appState.favorites.filter(id => id !== qId);
      } else {
        appState.favorites.push(qId);
      }
      saveState();
      if (currentView === 'quiz') renderQuiz();
    }

    function finishQuiz() {
      stopTimer();
      if (!quizSession) return navigate('home');
      let correct = 0;
      quizSession.questions.forEach((q, i) => {
        if (quizSession.userAnswers[i] === q.shuffledCorrect) correct++;
      });
      if (quizSession.mode === 'ticket' && quizSession.ticketId) {
        const prev = appState.ticketBest[quizSession.ticketId];
        if (!prev || correct >= prev.correct) {
          appState.ticketBest[quizSession.ticketId] = {
            correct,
            total: quizSession.questions.length
          };
          saveState();
        }
      }
      currentView = 'result';
      updateActiveNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderResult();
    }

              <button onclick="navigate('home')" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-700 transition">

          <!-- Детальный разбор всех вопросов сессии -->

    /**
     * 16. ШПАРГАЛКА ФОРМУЛ И ИНТЕРАКТИВНАЯ ТАБЛИЦА Φ(z)
     */
    function buildPhiHelperHtml() {
      const zNum = parseFloat(String(zSearchValue).replace(',', '.'));
      let lookupResult = 'Введите значение z от −3.09 до +3.09 (например: −1.13 или 1.22)';
      let highlightRow = null;
      let highlightCol = null;

      if (!isNaN(zNum) && Math.abs(zNum) <= 3.09) {
        const absZ = Math.abs(zNum);
        const rowKey = (Math.floor(absZ * 10 + 1e-9) / 10).toFixed(1);
        const colIdx = Math.round((absZ - parseFloat(rowKey)) * 100);
        if (PHI_TABLE[rowKey] && PHI_TABLE[rowKey][colIdx] !== undefined) {
          highlightRow = rowKey;
          highlightCol = colIdx;
          const phiPos = PHI_TABLE[rowKey][colIdx];
          const finalPhi = zNum < 0 ? (1 - phiPos) : phiPos;
          const laplacePhi0 = finalPhi - 0.5;
          lookupResult = zNum < 0
            ? `Φ(${zNum.toFixed(2)}) = 1 − Φ(${absZ.toFixed(2)}) = 1 − ${phiPos.toFixed(4)} = <strong>${finalPhi.toFixed(4)}</strong> (${(finalPhi * 100).toFixed(1)}%)`
            : `Φ(${zNum.toFixed(2)}) = <strong>${finalPhi.toFixed(4)}</strong> (${(finalPhi * 100).toFixed(1)}%) • Функция Лапласа Φ₀ = ${laplacePhi0.toFixed(4)}`;
        }
      }

      const rowsHtml = Object.keys(PHI_TABLE).map(rowKey => {
        const cells = PHI_TABLE[rowKey].map((val, cIdx) => {
          const isHl = rowKey === highlightRow && cIdx === highlightCol;
          return `<td class="${isHl ? 'bg-brand-600 text-white font-bold' : ''}">${val.toFixed(4)}</td>`;
        }).join('');
        return `<tr><th>${rowKey}</th>${cells}</tr>`;
      }).join('');

      return `
        <div class="space-y-3">
          <div class="bg-brand-50 dark:bg-brand-500/10 border border-brand-200 dark:border-brand-500/30 rounded-xl p-3 space-y-2">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <label class="text-xs font-bold text-slate-800 dark:text-slate-200">Быстрый поиск по таблице Φ(z):</label>
              <input type="text" value="${zSearchValue}" oninput="zSearchValue=this.value; refreshPhiWidgets();" placeholder="Напр. -1.13" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs font-mono w-full sm:w-36 focus:outline-none focus:border-brand-500" />
            </div>
            <div class="text-xs text-slate-800 dark:text-slate-200">${lookupResult}</div>
          </div>

          <div class="overflow-x-auto thin-scroll max-h-72 border border-slate-200 dark:border-slate-700 rounded-xl">
            <table class="task-table">
              <thead>
                <tr>
                  <th>z</th>
                  <th>0.00</th><th>0.01</th><th>0.02</th><th>0.03</th><th>0.04</th>
                  <th>0.05</th><th>0.06</th><th>0.07</th><th>0.08</th><th>0.09</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function refreshPhiWidgets() {
      const modalBody = document.getElementById('quick-modal-body');
      if (modalBody && !document.getElementById('quick-modal').classList.contains('hidden')) {
        modalBody.innerHTML = buildPhiHelperHtml();
      }
      const pagePhiBox = document.getElementById('cheatsheet-phi-box');
      if (pagePhiBox) {
        pagePhiBox.innerHTML = buildPhiHelperHtml();
      }
    }

    function toggleQuickModal(show) {
      const modal = document.getElementById('quick-modal');
      if (!modal) return;
      if (show) {
        document.getElementById('quick-modal-body').innerHTML = buildPhiHelperHtml();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function toggleResetModal(show) {
      const modal = document.getElementById('reset-modal');
      if (modal) modal.classList.toggle('hidden', !show);
    }

    function confirmResetProgress() {
      appState.answered = {};
      appState.errors = [];
      appState.favorites = [];
      appState.ticketBest = {};
      saveState();
      toggleResetModal(false);
      renderHome();
    }

    function renderCheatsheet() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="space-y-4">
          <div>
            <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">Шпаргалка формул, лекций и таблица Φ(z)</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Ключевые формулы из методички и лекций 2026 года (знать наизусть)</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">1. Финансовые показатели и инвестиции</div>
              <div>• <strong>NPV</strong> = Σ CFₜ / (1 + r)ᵗ; Перпетуитет: <strong>PV = CF / r</strong></div>
              <div>• <strong>PI</strong> = Σ дисконт. притоков / дисконт. инвестиции; <strong>IRR</strong>: NPV(IRR) = 0</div>
              <div>• <strong>Фишер:</strong> 1 + r_nom = (1 + r_real)(1 + π)</div>
              <div>• <strong>CAPM:</strong> i_A = i_f + β_A · ERP + i_Ap</div>
              <div>• <strong>Бюджет:</strong> Оценка + Contingency = Cost Baseline; + Mgmt Reserve = Бюджет</div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">2. Метод PERT и вероятности</div>
              <div>• <strong>tₑ</strong> = (a + 4m + b) / 6; <strong>σ²</strong> = ((b − a) / 6)²</div>
              <div>• <strong>Tₑ</strong> = Σ tₑ (крит. путь); <strong>σ²_пр</strong> = Σ σ² (крит. путь); <strong>σ</strong> = √σ²_пр</div>
              <div>• <strong>z</strong> = (D − Tₑ) / σ; <strong>P</strong> = Φ(z) = 0.5 + Φ₀(z); Φ(−z) = 1 − Φ(z)</div>
              <div>• <strong>Обратная задача:</strong> D = Tₑ + z·σ (округлять вверх!)</div>
              <div>• 90% → 1.282 | 95% → 1.645 | 97.5% → 1.96 | 99% → 2.326</div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">3. Метод освоенного объёма (EVM, Лекция 11)</div>
              <div>• <strong>CV = EV − AC</strong> (&lt; 0 перерасход); <strong>SV = EV − PV</strong> (&lt; 0 отставание)</div>
              <div>• <strong>CPI = EV / AC</strong>; <strong>SPI = EV / PV</strong></div>
              <div>• <strong>EAC = BAC / CPI</strong> (при сохранении CPI); <strong>VAC = BAC − EAC</strong></div>
              <div>• <strong>TCPI(BAC) = (BAC − EV) / (BAC − AC)</strong></div>
              <div>• <strong>Критическая цепь:</strong> Project, Feeding и Resource буферы</div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
              <div class="font-bold text-sm text-brand-600 dark:text-brand-400">4. Сети, качество, риски и Make-or-Buy</div>
              <div>• <strong>кA→нB(+L):</strong> ES_B ≥ EF_A + L | <strong>нA→нB(+L):</strong> ES_B ≥ ES_A + L</div>
              <div>• <strong>кA→кB(+L):</strong> EF_B ≥ EF_A + L | <strong>нA→кB(+L):</strong> EF_B ≥ ES_A + L</div>
              <div>• <strong>Make-or-Buy Q*</strong> = FC_запуск / (P_покупки − VC_своя)</div>
              <div>• <strong>Качество (Лекция 3):</strong> правило Боэма 1:10:100; SLA 99,9% = 8,8 ч/год</div>
              <div>• <strong>Scope Baseline:</strong> Описание содержания + WBS + Словарь WBS</div>
            </div>
          </div>

          <div id="cheatsheet-phi-box" class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
            ${buildPhiHelperHtml()}
          </div>
        </div>
      `;
    }

    /**
     * 17. ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
     */
    function initApp() {
      try {
        loadState();
        updateBadges();
        navigate('home');
      } catch (err) {
        const el = document.getElementById('app-content');
        if (el) {
          el.innerHTML = `<div class="p-4 rounded-xl bg-rose-50 text-rose-700 text-sm">Ошибка запуска: ${err.message}</div>`;
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
